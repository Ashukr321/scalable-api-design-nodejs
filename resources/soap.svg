<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker>
    <style>
      text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}
      .t{font-size:26px;font-weight:700}.s{font-size:14px;fill:#475569}.b{font-size:15px;font-weight:600}
      .m{font-family:Consolas,"Courier New",monospace;font-size:12px}.sm{font-size:12px;fill:#475569}
    </style>
  </defs>
  <rect width="900" height="600" fill="#f8fafc"/>
  <text x="40" y="48" class="t">SOAP API</text>
  <text x="40" y="72" class="s">Strict XML messages in an Envelope, contract defined by WSDL, WS-* standards for security</text>

  <rect x="360" y="92" width="180" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="116" text-anchor="middle" class="b">WSDL contract</text>
  <text x="450" y="136" text-anchor="middle" class="sm">operations · XSD types · URL</text>
  <g stroke="#d97706" stroke-dasharray="5 4" stroke-width="1.5" fill="none">
    <path d="M360 121 H130 V128"/><path d="M540 121 H770 V128"/>
  </g>
  <text x="200" y="114" class="sm">client generated from</text>
  <text x="590" y="114" class="sm">service implements</text>

  <rect x="40" y="130" width="180" height="100" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="130" y="176" text-anchor="middle" class="b">SOAP Client</text>
  <text x="130" y="196" text-anchor="middle" class="sm">Java · .NET · node-soap</text>
  <rect x="680" y="130" width="180" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="770" y="176" text-anchor="middle" class="b">SOAP Web Service</text>
  <text x="770" y="196" text-anchor="middle" class="sm">/UserService</text>

  <g stroke="#475569" stroke-width="1.5" marker-end="url(#a)">
    <line x1="220" y1="175" x2="676" y2="175"/><line x1="680" y1="210" x2="224" y2="210"/>
  </g>
  <text x="450" y="168" text-anchor="middle" font-size="13">HTTP POST · text/xml · SOAPAction header</text>
  <text x="450" y="203" text-anchor="middle" font-size="13">XML response Envelope, or soap:Fault on error</text>

  <rect x="40" y="260" width="400" height="290" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="56" y="285" class="b">soap:Envelope</text>
  <rect x="60" y="298" width="360" height="70" rx="8" fill="#fff" stroke="#7c3aed" stroke-dasharray="5 4"/>
  <text x="76" y="322" font-size="14" font-weight="600">soap:Header (optional)</text>
  <text x="76" y="344" class="sm">WS-Security tokens, transactions, routing</text>
  <rect x="60" y="380" width="360" height="150" rx="8" fill="#fff" stroke="#7c3aed"/>
  <text x="76" y="404" font-size="14" font-weight="600">soap:Body (required)</text>
  <text x="76" y="428" class="m" xml:space="preserve">&lt;GetUser&gt;</text>
  <text x="76" y="446" class="m" xml:space="preserve">  &lt;UserId&gt;42&lt;/UserId&gt;</text>
  <text x="76" y="464" class="m" xml:space="preserve">&lt;/GetUser&gt;</text>
  <rect x="76" y="478" width="328" height="40" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="90" y="503" font-size="13">soap:Fault → faultcode, faultstring, detail</text>

  <rect x="460" y="260" width="400" height="290" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="476" y="285" class="b">Raw request</text>
  <text x="476" y="310" class="m" xml:space="preserve">POST /UserService HTTP/1.1</text>
  <text x="476" y="327" class="m" xml:space="preserve">Content-Type: text/xml; charset=utf-8</text>
  <text x="476" y="344" class="m" xml:space="preserve">SOAPAction: "GetUser"</text>
  <text x="476" y="374" class="m" xml:space="preserve">&lt;soap:Envelope</text>
  <text x="476" y="391" class="m" xml:space="preserve">  xmlns:soap="...xmlsoap.org/soap/envelope/"&gt;</text>
  <text x="476" y="408" class="m" xml:space="preserve">  &lt;soap:Header/&gt;</text>
  <text x="476" y="425" class="m" xml:space="preserve">  &lt;soap:Body&gt;</text>
  <text x="476" y="442" class="m" xml:space="preserve">    &lt;GetUser&gt;</text>
  <text x="476" y="459" class="m" xml:space="preserve">      &lt;UserId&gt;42&lt;/UserId&gt;</text>
  <text x="476" y="476" class="m" xml:space="preserve">    &lt;/GetUser&gt;</text>
  <text x="476" y="493" class="m" xml:space="preserve">  &lt;/soap:Body&gt;</text>
  <text x="476" y="510" class="m" xml:space="preserve">&lt;/soap:Envelope&gt;</text>

  <text x="40" y="580" class="s">Used in: banking, payments, telecom, government and legacy enterprise integrations</text>
</svg>
