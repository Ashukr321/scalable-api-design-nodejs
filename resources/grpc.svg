<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker>
    <style>
      text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}
      .t{font-size:26px;font-weight:700}.s{font-size:14px;fill:#475569}.b{font-size:15px;font-weight:600}
      .m{font-family:Consolas,"Courier New",monospace;font-size:13px}.sm{font-size:12px;fill:#475569}
    </style>
  </defs>
  <rect width="900" height="620" fill="#f8fafc"/>
  <text x="40" y="48" class="t">gRPC API</text>
  <text x="40" y="72" class="s">High-performance RPC: Protocol Buffers over HTTP/2, with generated client and server code</text>

  <rect x="330" y="95" width="240" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="346" y="119" class="b">user.proto</text>
  <text x="346" y="143" class="m" xml:space="preserve">service UserService {</text>
  <text x="346" y="161" class="m" xml:space="preserve">  rpc GetUser(UserReq)</text>
  <text x="346" y="179" class="m" xml:space="preserve">    returns (User);</text>
  <text x="346" y="197" class="m" xml:space="preserve">}</text>
  <g stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)">
    <line x1="370" y1="215" x2="190" y2="256"/><line x1="530" y1="215" x2="710" y2="256"/>
  </g>
  <text x="215" y="205" class="sm">protoc codegen</text>
  <text x="595" y="205" class="sm">protoc codegen</text>

  <rect x="40" y="260" width="240" height="120" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="160" y="288" text-anchor="middle" class="b">Client App</text>
  <rect x="60" y="305" width="200" height="56" rx="6" fill="#fff" stroke="#0284c7"/>
  <text x="160" y="330" text-anchor="middle" font-size="13">Generated stub</text>
  <text x="160" y="348" text-anchor="middle" class="sm">client.getUser({ id: 42 })</text>

  <rect x="620" y="260" width="240" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="740" y="288" text-anchor="middle" class="b">gRPC Server</text>
  <rect x="640" y="305" width="200" height="56" rx="6" fill="#fff" stroke="#16a34a"/>
  <text x="740" y="330" text-anchor="middle" font-size="13">Service implementation</text>
  <text x="740" y="348" text-anchor="middle" class="sm">getUser(call, callback)</text>

  <rect x="290" y="262" width="320" height="22" rx="11" fill="#ede9fe"/>
  <text x="450" y="277" text-anchor="middle" font-size="12" font-weight="600" fill="#6d28d9">HTTP/2 · binary protobuf · multiplexed · TLS</text>
  <g stroke="#475569" stroke-width="1.5" marker-end="url(#a)">
    <line x1="282" y1="315" x2="616" y2="315"/><line x1="616" y1="355" x2="284" y2="355"/>
  </g>
  <text x="450" y="308" text-anchor="middle" class="m">GetUser(UserReq { id: 42 })</text>
  <text x="450" y="348" text-anchor="middle" class="m">User { id: 42, name: "Asha" }</text>

  <text x="40" y="420" class="b">Four call types</text>
  <g fill="#fff" stroke="#cbd5e1">
    <rect x="40" y="432" width="195" height="140" rx="10"/><rect x="255" y="432" width="195" height="140" rx="10"/>
    <rect x="470" y="432" width="195" height="140" rx="10"/><rect x="685" y="432" width="195" height="140" rx="10"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600">
    <text x="137" y="456">Unary</text><text x="352" y="456">Server streaming</text>
    <text x="567" y="456">Client streaming</text><text x="782" y="456">Bidirectional</text>
  </g>
  <g font-size="13" font-weight="700" fill="#475569">
    <text x="52" y="500">C</text><text x="218" y="500">S</text>
    <text x="267" y="500">C</text><text x="433" y="500">S</text>
    <text x="482" y="500">C</text><text x="648" y="500">S</text>
    <text x="697" y="500">C</text><text x="863" y="500">S</text>
  </g>
  <g stroke="#475569" stroke-width="1.5" marker-end="url(#a)">
    <line x1="68" y1="480" x2="205" y2="480"/><line x1="205" y1="510" x2="68" y2="510"/>
    <line x1="283" y1="472" x2="420" y2="472"/><line x1="420" y1="488" x2="283" y2="488"/>
    <line x1="420" y1="503" x2="283" y2="503"/><line x1="420" y1="518" x2="283" y2="518"/>
    <line x1="498" y1="472" x2="635" y2="472"/><line x1="498" y1="487" x2="635" y2="487"/>
    <line x1="498" y1="502" x2="635" y2="502"/><line x1="635" y1="518" x2="498" y2="518"/>
    <line x1="713" y1="472" x2="850" y2="472"/><line x1="850" y1="487" x2="713" y2="487"/>
    <line x1="713" y1="502" x2="850" y2="502"/><line x1="850" y1="518" x2="713" y2="518"/>
  </g>
  <g text-anchor="middle" class="sm">
    <text x="137" y="550">1 request → 1 response</text><text x="352" y="550">1 request → stream back</text>
    <text x="567" y="550">stream up → 1 response</text><text x="782" y="550">both stream at once</text>
  </g>

  <text x="40" y="604" class="s">Best for: internal microservice calls, low latency, many languages · Browsers need gRPC-Web / a proxy</text>
</svg>
