<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <style>
      text{font-family:"Segoe UI",Arial,sans-serif}
      .c{font-size:15px;font-weight:600;fill:#fff}
    </style>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- node graph decoration -->
  <g stroke="#38bdf8" stroke-opacity=".5" stroke-width="2">
    <line x1="930" y1="80" x2="1060" y2="140"/><line x1="1060" y1="140" x2="960" y2="220"/>
    <line x1="930" y1="80" x2="960" y2="220"/><line x1="1060" y1="140" x2="1140" y2="70"/>
    <line x1="1060" y1="140" x2="1130" y2="230"/>
  </g>
  <g fill="#0f172a" stroke-width="3">
    <circle cx="930" cy="80" r="14" stroke="#22c55e"/><circle cx="1060" cy="140" r="22" stroke="#38bdf8"/>
    <circle cx="960" cy="220" r="14" stroke="#f472b6"/><circle cx="1140" cy="70" r="12" stroke="#facc15"/>
    <circle cx="1130" cy="230" r="12" stroke="#a78bfa"/>
  </g>

  <text x="60" y="96" font-size="16" font-weight="600" fill="#38bdf8" letter-spacing="3">BACKEND · NODE.JS</text>
  <text x="60" y="150" font-size="46" font-weight="800" fill="#fff">Scalable API Design</text>
  <text x="60" y="186" font-size="18" fill="#cbd5e1">Every major API style, explained and built with Node.js</text>

  <g>
    <rect x="60" y="216" width="72" height="34" rx="17" fill="#16a34a"/><text x="96" y="238" text-anchor="middle" class="c">REST</text>
    <rect x="144" y="216" width="98" height="34" rx="17" fill="#db2777"/><text x="193" y="238" text-anchor="middle" class="c">GraphQL</text>
    <rect x="254" y="216" width="70" height="34" rx="17" fill="#0284c7"/><text x="289" y="238" text-anchor="middle" class="c">gRPC</text>
    <rect x="336" y="216" width="72" height="34" rx="17" fill="#7c3aed"/><text x="372" y="238" text-anchor="middle" class="c">SOAP</text>
    <rect x="420" y="216" width="100" height="34" rx="17" fill="#d97706"/><text x="470" y="238" text-anchor="middle" class="c">Webhook</text>
    <rect x="532" y="216" width="114" height="34" rx="17" fill="#dc2626"/><text x="589" y="238" text-anchor="middle" class="c">WebSocket</text>
  </g>
</svg>
